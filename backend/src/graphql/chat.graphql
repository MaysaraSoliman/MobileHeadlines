type ChatParticipant {
  user: User!
}

type Chat {
  id: ID!
  name: String
  isGroup: Boolean
  createdAt: String!
  updatedAt: String!
  participants: [ChatParticipant!]!
  messages: [Message!]!
  lastMessage: Message
  unreadCount: Int
}

type Message {
  id: ID!
  content: String!
  sender: User!
  chat: Chat!
  read: Boolean
  createdAt: String!
}

type Query {
  myChats: [Chat!]!
  chatMessages(chatId: ID!): [Message!]!
  unreadMessageCount: Int
}

type Mutation {
  createChat(userIds: [ID!]!, name: String): Chat!
  sendMessage(chatId: ID!, content: String!): Message!
  markChatAsRead(chatId: ID!): Boolean
}

type Subscription {
  messageSent(chatId: ID!): Message!
  messageReceived(userId: ID!): Message!
}
